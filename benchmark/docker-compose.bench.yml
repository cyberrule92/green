# Isolated benchmark API container.
#
#   docker compose -f docker-compose.ubuntu-vgpu.yml \
#                  -f benchmark/docker-compose.bench.yml \
#                  --env-file .env up -d --build api-bench
#
# Same compose project as the live stack, so it joins the same network and
# reuses the running vLLM containers — but it is a *separate* API process on
# :8101 with its own data directory. The live API on :8100, the production RL
# state, and the signed audit log are never touched by a benchmark run.
#
# Every environment variable below is a confirmed confounder, each read once at
# module import so it cannot drift mid-run. Removing any one of them makes the
# three arms incomparable; see benchmark/README.md for what each one does.

services:
  api-bench:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SYSTEM_SERVICE_URL: http://metrics:9000/metrics
      VLLM_MEDIUM_URL: http://vllm-medium:8001/v1
      VLLM_FULL_URL: http://vllm-full:8002/v1
      VLLM_MOE_URL: ${VLLM_MOE_URL:-http://vllm-moe:8003/v1}
      VLLM_STEM_MATH_URL: ${VLLM_STEM_MATH_URL:-http://vllm-stem-math:8004/v1}
      VLLM_STEM_SCIENCE_URL: ${VLLM_STEM_SCIENCE_URL:-http://vllm-stem-science:8005/v1}
      VLLM_STEM_CODING_URL: ${VLLM_STEM_CODING_URL:-http://vllm-stem-coding:8006/v1}
      VLLM_FALLBACK_URL: ${VLLM_FALLBACK_URL:-http://vllm-fallback:8007/v1}
      VLLM_CODER7B_URL: ${VLLM_CODER7B_URL:-http://vllm-coder-7b:8009/v1}
      POLICY_CONFIG_PATH: /app/config/policies.json

      # ── Isolation: own audit log, own DB, own learned state ──────────────
      DECISION_LOG_PATH: /app/data/bench/decision_logs.jsonl
      CONVERSATION_STORE_PATH: /app/data/bench/green_ai.db
      RAG_STORE_PATH: /app/data/bench/rag_store.json
      RL_STATE_PATH: /app/data/bench/rl_state.json
      QL_ESTIMATOR_STATE_PATH: /app/data/bench/ql_estimator_state.json
      SEMANTIC_CACHE_PATH: /app/data/bench/semantic_cache.json
      DECISION_ENGINE_LOG: /app/data/bench/decision_engine.log

      # ── Frozen router ────────────────────────────────────────────────────
      # A cache hit short-circuits routing entirely, returns system_co2_g 0.0
      # with a fabricated model_variant, and is only conversation-scoped for
      # followups — so arm 1's answers would be served to arms 2 and 3.
      SEMANTIC_CACHE_ENABLED: "false"
      # Unseeded Dirichlet noise on every request: the same prompt routes
      # differently twice in a row.
      RL_EXPLORATION: "false"
      # RL reads and writes on every request. Unfrozen, arm 1 trains the router
      # that arm 2 then runs against.
      RL_ALPHA_0: "0"
      # LR=0 does not freeze the estimator: update() still increments n_obs and
      # adjust() gates trust on n_obs >= warmup. A variant crossing the warmup
      # threshold mid-run flips from identity to trusted between two arms.
      QL_ESTIMATOR_ENABLED: "false"
      # Background loop (10s) can flip `available` and change the candidate set.
      MOE_RECONCILER_ENABLED: "false"

      # ── Frozen grid ──────────────────────────────────────────────────────
      # Live CI drifts between arms, scales every carbon number, and straddles
      # the hard CI>=450 threshold that penalises `full`. Empty token → the
      # fixed fallback below is used. Sweep GRID_CARBON_FALLBACK to produce the
      # carbon-intensity sensitivity curve.
      EMAP_TOKEN: ""
      GRID_CARBON_FALLBACK: ${BENCH_GRID_CI:-475}

      # ── Guardrails: rails ON, LLM classifiers OFF ────────────────────────
      # Each classifier adds an LLM call with a 6s timeout that fails open —
      # pure latency variance, independent of whether anything is blocked. The
      # action-based rails still run; flagged samples are excluded by the
      # harness instead.
      GUARDRAILS_ENABLED: "true"
      GUARDRAILS_LLM_CLASSIFIER_ENABLED: "false"
      GUARDRAILS_DEFENSE_IN_DEPTH: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      metrics:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      # Bench zoo: identical to the live one except that candidates with no
      # distinct live backend are marked unavailable. See benchmark/README.md.
      - ./benchmark/config:/app/config:ro
    ports:
      - "8101:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data = json.load(urllib.request.urlopen('http://127.0.0.1:8100/health/ready', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' else 1)"]
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 8
    restart: "no"
