server {
  listen 80;
  server_name _;
  client_max_body_size 32m;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS resolver. Combined with a *variable* in proxy_pass
  # below, this forces nginx to re-resolve the upstream hostname every TTL
  # window instead of caching the IP at config-load. Without this, recreating
  # the api container (new container = new IP) leaves the frontend pointed at
  # a dead address and every /api/* request returns 502 Bad Gateway.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Shared proxy settings macro (repeated per location — nginx doesn't support include here)
  # Note: when proxy_pass contains a variable, nginx skips its built-in URI
  # rewriting, so we append $request_uri explicitly to forward the full path.
  location /api/ {
    set $api_upstream "http://api:8100";
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Required for multipart/form-data file uploads — do NOT buffer large bodies
    proxy_request_buffering off;
  }

  location /health {
    set $api_upstream "http://api:8100";
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
